<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Clean Stream</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="/styles.css?v=0.18.0" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="home view is-active" data-view="home">
      <header class="site-header">
        <a class="masthead home-link" href="/">CLEAN STREAM</a>
      </header>

      <div class="home-spacer"></div>

      <section class="home-inputs" aria-label="Find a stream">
        <div class="ticker-row" id="live-ticker-row">
          <div class="ticker-field">
            <div class="live-ticker" id="live-ticker" aria-label="Live and upcoming events">
              <div class="ticker-track" id="ticker-track"><span class="ticker-loading">LOADING LIVE EVENTS</span></div>
            </div>
          </div>
          <button class="text-action" id="explore-button" type="button">EXPLORE</button>
        </div>
        <div class="explore-filter-row" id="explore-filter-row" hidden>
          <div class="explore-filters" id="explore-filters" aria-label="Explore event categories"></div>
        </div>
        <form class="search-row" id="event-form">
          <input id="event-query" type="search" placeholder="FIND STREAM" aria-label="Find stream" autocomplete="off" maxlength="100" />
          <button class="text-action" id="search-button" type="submit">SEARCH</button>
        </form>
        <form class="search-row" id="link-form">
          <input id="stream-url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="PASTE LINK" aria-label="Paste link" />
          <button class="text-action" id="open-stream" type="submit">WATCH</button>
        </form>
        <p class="message" id="home-message" aria-live="polite"></p>
      </section>
      <section id="search-results" class="search-results" aria-label="Event results" hidden></section>
      <button class="settings-trigger" id="settings-button" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M20.3 13v-2l-2.2-.7a7 7 0 0 0-.6-1.5l1.1-2-1.4-1.4-2 1.1a7 7 0 0 0-1.5-.6L13 3.7h-2l-.7 2.2a7 7 0 0 0-1.5.6l-2-1.1-1.4 1.4 1.1 2a7 7 0 0 0-.6 1.5l-2.2.7v2l2.2.7c.1.5.3 1 .6 1.5l-1.1 2 1.4 1.4 2-1.1c.5.3 1 .5 1.5.6l.7 2.2h2l.7-2.2c.5-.1 1-.3 1.5-.6l2 1.1 1.4-1.4-1.1-2c.3-.5.5-1 .6-1.5l2.2-.7ZM12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 1 0 0-7.8Z"/>
        </svg>
      </button>
    </section>


    <section class="settings view" data-view="settings" aria-hidden="true">
      <header class="settings-header">
        <div class="player-home-group">
          <button class="text-action" id="settings-back" type="button" aria-label="Back">&lt;</button>
          <a class="player-brand home-link" href="/">CLEAN STREAM</a>
        </div>
      </header>

      <section class="settings-panel" aria-label="Settings">
        <section class="settings-page is-active" data-settings-page="menu">
          <h1 class="settings-title">SETTINGS</h1>
          <nav class="settings-directory" aria-label="Settings sections">
            <button class="settings-directory-row" type="button" data-open-settings="sources"><span>CUSTOM SOURCES</span><span aria-hidden="true">&gt;</span></button>
            <button class="settings-directory-row" type="button" data-open-settings="preferences"><span>EVENT DISPLAY PREFERENCES</span><span aria-hidden="true">&gt;</span></button>
          </nav>
        </section>

        <section class="settings-page" data-settings-page="sources" hidden>
          <div class="settings-title-row">
            <h1 class="settings-title">CUSTOM SOURCES</h1>
            <div class="settings-source-tools" aria-label="Custom source tools">
              <button class="text-action" id="test-all-sources" type="button">TEST ALL</button>
              <button class="text-action" id="import-sources" type="button">IMPORT</button>
              <button class="text-action" id="export-sources" type="button">EXPORT</button>
              <button class="text-action" id="share-sources" type="button">SHARE</button>
              <input id="import-sources-file" type="file" accept="application/json,.json" hidden />
            </div>
          </div>
          <form class="search-row settings-add-row" id="custom-source-form">
            <textarea id="custom-source-url" rows="4" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ADD SOURCE URLS" aria-label="Add source URLs, one per line"></textarea>
            <button class="text-action" type="submit">ADD</button>
          </form>
          <p class="message settings-message" id="settings-message" aria-live="polite"></p>
          <div class="custom-source-list" id="custom-source-list"></div>
        </section>

        <section class="settings-page" data-settings-page="preferences" hidden>
          <h1 class="settings-title">EVENT DISPLAY PREFERENCES</h1>
          <div class="preference-section">
            <h2 class="preference-heading">CATEGORIES</h2>
            <p class="preference-note">DRAG TO SET PRIORITY · SHOWTIME STILL COMES FIRST</p>
            <div class="preference-list" id="event-category-list"></div>
          </div>
          <div class="preference-section favorites-section">
            <h2 class="preference-heading">FAVORITES</h2>
            <p class="preference-note">ONE TEAM, ATHLETE OR FIGHTER PER LINE · FAVORITES BREAK TIES AT THE SAME SHOWTIME</p>
            <form class="favorites-form" id="favorites-form">
              <textarea id="favorites-input" rows="6" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="NEW YORK KNICKS
JON JONES
MAX VERSTAPPEN" aria-label="Favorite teams, athletes or fighters"></textarea>
              <button class="text-action" type="submit">SAVE</button>
            </form>
            <p class="message settings-message" id="preferences-message" aria-live="polite"></p>
          </div>
        </section>
      </section>
    </section>

    <section class="player view" data-view="player" aria-hidden="true">
      <header class="player-header">
        <div class="player-home-group">
          <button class="text-action player-back" id="back-button" type="button" aria-label="Back">&lt;</button>
          <a class="player-brand home-link" href="/">CLEAN STREAM</a>
        </div>
        <button class="text-action" id="refresh-button" type="button" disabled>REFRESH</button>
        <button class="text-action" id="sources-button" type="button" aria-expanded="false" aria-controls="source-menu">SOURCES</button>
      </header>
      <div class="source-menu" id="source-menu" hidden role="menu" aria-label="Available sources"></div>
      <nav class="tvm-player-nav" id="tvm-player-nav" aria-label="Episode navigation" hidden>
        <button class="text-action" id="previous-episode" type="button">&lt; PREVIOUS EPISODE</button>
        <button class="text-action" id="autoplay-button" type="button" aria-pressed="false">AUTOPLAY OFF</button>
        <button class="text-action" id="next-episode" type="button">NEXT EPISODE &gt;</button>
      </nav>

      <section class="player-stage">
        <video
          id="video"
          playsinline
          controls
          preload="metadata"
          x-webkit-airplay="allow"
        ></video>
        <div id="youtube-player" hidden></div>
        <div id="twitch-player" hidden></div>

        <div class="player-empty" id="player-empty">
          <div class="empty-copy" id="empty-copy">LOADING</div>
        </div>
      </section>

      <footer class="player-controls" aria-label="Playback controls">
        <button class="text-action" id="play-button" type="button" disabled>PLAY</button>
        <button class="text-action" id="mute-button" type="button">MUTE</button>
        <button class="text-action live-control" id="live-button" type="button" disabled aria-label="Go to live" title="No live stream loaded">
          <span class="live-dot" aria-hidden="true"></span><span>LIVE</span>
        </button>
        <button class="text-action" id="tv-button" type="button" hidden>CAST</button>
        <button class="text-action" id="fullscreen-button" type="button">FULLSCREEN</button>
      </footer>

      <p class="message player-message" id="player-message" aria-live="polite"></p>
    </section>
  </main>

  <script>window.__onGCastApiAvailable = value => { window.__castReady = value; };</script>
  <script type="module" src="/app.js?v=0.18.0"></script>
  <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
